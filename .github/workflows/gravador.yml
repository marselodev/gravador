name: Gravador snopey

on:
  schedule:
    # Roda a cada 15 minutos, o dia inteiro, para checar e pegar a live sempre do começo
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  gravar_live:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Tempo máximo de cada bloco caso a live seja muito longa

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Instalar Dependências e Streamlink Atualizado
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone python3-pip python3-setuptools
          pip3 install --upgrade streamlink

      - name: Configurar o Google Drive (Rclone)
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF

      - name: Verificar e Gravar Bloco da Live (.mp4)
        run: |
          echo "Checando se o canal snopey está ao vivo..."
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # Grava em .mp4 na qualidade máxima (1080p60fps se disponível)
          streamlink twitch.tv/snopey best --twitch-disable-hosting --twitch-low-latency -o "snopey_${TIMESTAMP}.mp4" || true

      - name: Enviar para o Google Drive
        if: always()
        run: |
          echo "Aguardando 5 segundos para o arquivo fechar totalmente..."
          sleep 5
          
          # Só envia para o Drive se o arquivo existir e NÃO estiver zerado
          if [ -f *.mp4 ] && [ -s *.mp4 ]; then
            echo "Iniciando upload do bloco de vídeo salvo (.mp4)..."
            rclone copy . gdrive:Lives_Gravadas --include "*.mp4" -v
            echo "Upload concluído com sucesso!"
            rm -f *.mp4
          else
            echo "Nenhum arquivo de vídeo real encontrado (canal offline)."
            rm -f *.mp4
          fi
