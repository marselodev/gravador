name: Gravador Automático de Lives

on:
  schedule:
    # Roda a cada 20 minutos, as 24 horas do dia, sem perder nenhuma live
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # Permite que o senhor inicie a gravação manualmente pelo botão se quiser

jobs:
  gravar_live:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Tempo máximo de gravação contínua (6 horas)

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Instalar Dependências e Streamlink Atualizado
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone python3-pip python3-setuptools
          pip3 install --upgrade streamlink

      - name: Configurar o Google Drive (Rclone)
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF

      - name: Verificar e Gravar a Live Inteira
        run: |
          echo "Checando se o canal snopey está ao vivo..."
          # O Streamlink grava a live inteira e só encerra o comando quando o streamer der "Offline"
          streamlink twitch.tv/snopey best --twitch-disable-hosting --twitch-low-latency -o "snopey_$(date +%Y%m%d_%H%M%S).mp4" || true

      - name: Enviar para o Google Drive
        if: always()
        run: |
          echo "Aguardando 5 segundos para o arquivo fechar totalmente..."
          sleep 5
          echo "Iniciando upload do vídeo salvo..."
          if ls *.mp4 1> /dev/null 2>&1; then
            rclone copy . gdrive:Lives_Gravadas --include "*.mp4" -v
            echo "Upload concluído com sucesso, mestre!"
            rm -f *.mp4
          else
            echo "Nenhum arquivo de vídeo encontrado (o canal deveria estar offline)."
          fi
