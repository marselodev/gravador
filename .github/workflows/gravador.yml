name: Gravador Automático de Lives

on:
  schedule:
    - cron: '*/20 17-23 * * *' # Mantém a checagem automática de 20 em 20 min
  workflow_dispatch: # Mantém o botão para você iniciar manualmente quando quiser

jobs:
  gravar_live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Instalar Streamlink e Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y streamlink rclone

      - name: Configurar o Google Drive (Rclone)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Verificar e Gravar a Live
        run: |
          echo "Checando se o canal snopey está ao vivo..."
          streamlink twitch.tv/snopey best -o "snopey_$(date +%Y%m%d_%H%M%S).mp4"

      - name: Enviar para o Google Drive
        if: always() # <--- O SEGREDO ESTÁ AQUI! Força o upload mesmo que a live caia e dê erro
        run: |
          echo "Iniciando upload dos arquivos salvos..."
          if ls *.mp4 1> /dev/null 2>&1; then
            rclone copy . gdrive:Lives_Gravadas --include "*.mp4" -v
            echo "Upload concluído com sucesso!"
          else
            echo "Nenhum arquivo de vídeo encontrado para enviar."
          fi
