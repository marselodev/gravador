name: Gravador Automático de Lives 24h

on:
  schedule:
    # Roda a cada 15 minutos, o dia inteiro, para garantir que o robô pegue a live assim que começar
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Trava de segurança: impede que um robô atrapalhe o outro se a live durar muitas horas
concurrency:
  group: gravador-snopey
  cancel-in-progress: false

jobs:
  gravar_live:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Tempo máximo seguro para cada execução no GitHub

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Instalar Dependências e Streamlink Atualizado
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone python3-pip python3-setuptools
          pip3 install --upgrade streamlink

      - name: Configurar o Google Drive (Rclone)
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF

      - name: Verificar e Gravar a Live Inteira
        run: |
          echo "Checando se o canal snopey está ao vivo..."
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # Executa o Streamlink. Ele vai gravar a live do início ao fim e só para quando o streamer ficar offline.
          streamlink twitch.tv/snopey best --twitch-disable-hosting --twitch-low-latency -o "snopey_${TIMESTAMP}.mp4" || true

      - name: Enviar para o Google Drive
        if: always()
        run: |
          echo "Aguardando 5 segundos para o arquivo fechar totalmente..."
          sleep 5
          
          # Verifica se o arquivo existe e se NÃO está zerado (evita enviar arquivos fantasmas de quando o canal tá offline)
          if [ -f *.mp4 ] && [ -s *.mp4 ]; then
            echo "Iniciando upload do vídeo salvo..."
            rclone copy . gdrive:Lives_Gravadas --include "*.mp4" -v
            echo "Upload concluído com sucesso!"
            rm -f *.mp4
          else
            echo "Nenhum arquivo de vídeo real encontrado (o canal estava offline)."
            rm -f *.mp4 # Limpa qualquer arquivo vazio que tenha sido criado
          fi
