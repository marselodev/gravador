name: Gravador

on:
  workflow_dispatch:

jobs:
  gravar_live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Instalar Dependências, Python e Streamlink
        run: |
          sudo apt update
          sudo apt install -y ffmpeg curl unzip
          pip install streamlink requests

      - name: Configurar o Google Drive (Rclone)
        run: |
          # Instala o rclone oficialmente via script do desenvolvedor
          curl https://rclone.org/install.sh | sudo bash
          
          # Cria a pasta de configuração do rclone e injeta o secret
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: Salvar Script de Gravação do Chat
        run: |
          cat << 'EOF' > gravador_chat.py
          import requests
          import time
          import json
          import os
          from datetime import datetime

          CHANNEL = "rodrigogoes"
          timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
          filename = f"{CHANNEL}_{timestamp}.json"
          
          print(f"Iniciando gravação do chat para {CHANNEL}...")
          
          while True:
              try:
                  url = f"https://tmi.twitch.tv/group/user/{CHANNEL}/chatters"
                  response = requests.get(url, timeout=5)
                  if response.status_code == 200:
                      data = response.json()
                  time.sleep(10)
              except Exception as e:
                  time.sleep(5)
          EOF

      - name: Iniciar Gravação Até a Live Acabar
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "Iniciando gravador de vídeo (Streamlink)..."
          
          # Inicia o streamlink para o canal do Rodrigo Góes salvando o arquivo mp4
          streamlink --twitch-disable-hosting twitch.tv/rodrigogoes best -o "rodrigogoes_${TIMESTAMP}.mp4" &
          STREAM_PID=$!

          # Loop para monitorar se a live continua online
          while kill -0 $STREAM_PID 2>/dev/null; do
            sleep 30
          done

          echo "A transmissão foi encerrada pelo streamer. Finalizando processos..."
          wait $STREAM_PID || true

      - name: Enviar Vídeo e Chat para o Google Drive
        if: always()
        run: |
          echo "Aguardando 5 segundos para consolidar os arquivos..."
          sleep 5
          
          # Procura por arquivos mp4 ou json em todo o workspace do github
          if find . -name "*.mp4" -o -name "*.json" | grep -q .; then
            echo "Arquivos encontrados! Enviando para o Google Drive..."
            rclone copy . gdrive:Lives_Gravadas --include "*.mp4" --include "*.json" -v --max-depth 2
            echo "Upload para o Drive concluído com sucesso!"
          else
            echo "Aviso: Nenhum arquivo de vídeo ou chat foi localizado para envio."
          fi

          rm -f *.mp4 *.json gravador_chat.py
