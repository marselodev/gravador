name: Gravador Automático de Lives

on:
  schedule:
    # Roda a cada 20 minutos, das 17h às 01h UTC (das 14h às 22h no Horário de Brasília)
    - cron: '*/20 17-23,0 * * *'
  workflow_dispatch:
    inputs:
      acao:
        description: 'Selecione "parar" para encerrar a gravação atual e enviar para o Drive'
        required: false
        default: 'iniciar'
        type: choice
        options:
          - iniciar
          - parar

jobs:
  gravar_live:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Tempo máximo de gravação (6 horas)

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Tratar Comando de Parada Manual
        if: github.event.inputs.acao == 'parar'
        run: |
          echo "Comando de parada recebido! Encerrando gravações ativas..."
          pkill -f streamlink || true
          exit 0

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Instalar Dependências e Streamlink Atualizado
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone python3-pip python3-setuptools
          pip3 install --upgrade streamlink

      - name: Configurar o Google Drive (Rclone)
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF

      - name: Verificar e Gravar a Live
        run: |
          echo "Checando se o canal oantunesz está ao vivo..."
          streamlink twitch.tv/oantunesz best --twitch-disable-hosting --twitch-low-latency -o "oantunesz_$(date +%Y%m%d_%H%M%S).mp4" || true

      - name: Enviar para o Google Drive
        if: always()
        run: |
          echo "Aguardando 3 segundos para o arquivo fechar totalmente..."
          sleep 3
          echo "Iniciando upload dos arquivos salvos..."
          if ls *.mp4 1> /dev/null 2>&1; then
            rclone copy . gdrive:Lives_Gravadas --include "*.mp4" -v
            echo "Upload concluído com sucesso!"
          else
            echo "Nenhum arquivo de vídeo encontrado para enviar."
          fi
