name: Gravador Automático de Lives

on:
  schedule:
    # Roda a cada 20 minutos, das 17h às 01h UTC (que equivale das 14h às 22h no Horário de Brasília)
    - cron: '*/20 17-23,0 * * *'
  workflow_dispatch: # Permite que você clique no botão para testar manualmente quando quiser

jobs:
  gravar_live:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Tempo máximo que o servidor do GitHub pode passar gravando (6 horas)

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Instalar Streamlink e Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y streamlink rclone

      - name: Configurar o Google Drive (Rclone)
        run: |
          mkdir -p ~/.config/rclone
          echo "[gdrive]" > ~/.config/rclone/rclone.conf
          echo "type = drive" >> ~/.config/rclone/rclone.conf
          echo "scope = drive" >> ~/.config/rclone/rclone.conf
          echo -n "token = " >> ~/.config/rclone/rclone.conf
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" | base64 -d >> ~/.config/rclone/rclone.conf

      - name: Verificar e Gravar a Live
        run: |
          echo "Checando se o canal emi_mge7 está ao vivo..."
          streamlink twitch.tv/emi_mge7 best --twitch-disable-hosting -o "emi_mge7_$(date +%Y%m%d_%H%M%S).mp4" || true

      - name: Enviar para o Google Drive
        if: always()
        run: |
          echo "Iniciando upload dos arquivos salvos..."
          if ls *.mp4 1> /dev/null 2>&1; then
            rclone copy . gdrive:Lives_Gravadas --include "*.mp4" -v
            echo "Upload concluído com sucesso!"
          else
            echo "Nenhum arquivo de vídeo encontrado para enviar."
          fi
