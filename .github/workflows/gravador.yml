name: Gravador Automático de Lives

on:
  schedule:
    # Roda a cada 20 minutos, das 17h às 01h UTC (das 14h às 22h no Horário de Brasília)
    - cron: '*/20 17-23,0 * * *'
  workflow_dispatch:

jobs:
  gravar_live:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Instalar Streamlink e Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y streamlink rclone

      - name: Configurar o Google Drive (Rclone)
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF

      - name: Verificar e Gravar a Live
        run: |
          echo "Checando se o canal emi_mge7 está ao vivo..."
          streamlink twitch.tv/emi_mge7 best --twitch-disable-hosting -o "emi_mge7_$(date +%Y%m%d_%H%M%S).mp4" || true

      - name: Enviar para o Google Drive
        if: always()
        run: |
          echo "Iniciando upload dos arquivos salvos..."
          if ls *.mp4 1> /dev/null 2>&1; then
            rclone copy . gdrive:Lives_Gravadas --include "*.mp4" -v
            echo "Upload concluído com sucesso!"
          else
            echo "Nenhum arquivo de vídeo encontrado para enviar."
          fi
